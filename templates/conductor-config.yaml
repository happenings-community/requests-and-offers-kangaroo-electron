---
tracing_override: ~
data_root_path: "###DEFINED_AT_RUNTIME###"
keystore:
  type: lair_server
  connection_url: "###DEFINED_AT_RUNTIME###"
admin_interfaces:
  - driver:
      type: websocket
      port: "###DEFINED_AT_RUNTIME###"
      danger_bind_addr: ~
      allowed_origins: "###DEFINED_AT_RUNTIME###"
network:
  request_timeout_s: 60
  base64_auth_material_bootstrap: ~
  base64_auth_material_relay: ~
  bootstrap_url: "###DEFINED_IN_KANGAROO_CONFIG###"
  # Required by the Holochain 0.6 config schema but unused: this app ships the
  # default iroh build, which connects through relay_url. Remove at Holochain 0.7,
  # whose schema has no signal_url and rejects unknown fields.
  signal_url: "wss://dev-test-bootstrap2.holochain.org/"
  relay_url: "###DEFINED_IN_KANGAROO_CONFIG###"
  target_arc_factor: 1
  report: none
  advanced: ~
db_sync_strategy: Resilient
tuning_params: ~
tracing_scope: ~